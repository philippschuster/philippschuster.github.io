name: Upgrade HugoBlox

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Upgrade to version'
        required: true
        default: 'Stable'
        type: choice
        options:
        - Stable
        - Beta (Preview)
  schedule:
    # Weekly stable update check, away from the busy start of the hour (UTC).
    - cron: '17 5 * * 1'

env:
  HUGOBLOX_CLI_VERSION: '0.12.8'
  VERSION_TYPE: ${{ inputs.version_type || 'Stable' }}

# The updater can propose changes; applying them requires a reviewed merge.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upgrade-hugoblox
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ./package.json
          run_install: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Hugo for upgrade compatibility checks
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 'latest'
          extended: true

      - name: Run Upgrade CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HBX_TELEMETRY_DISABLED: '1'
          HBX_UPDATE_CHECK_DISABLED: '1'
        run: |
          FLAGS=(--yes --ci)
          if [ "$VERSION_TYPE" = "Beta (Preview)" ]; then
            FLAGS+=(--canary)
          fi
          pnpm dlx "hugoblox@$HUGOBLOX_CLI_VERSION" upgrade "${FLAGS[@]}"

      - name: Read updated Hugo version
        id: hugo-version
        run: |
          YQ_VERSION="v4.44.1"
          wget -q --tries=3 --waitretry=1 -O "$RUNNER_TEMP/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$RUNNER_TEMP/yq"
          VERSION=$("$RUNNER_TEMP/yq" '.build.hugo_version // .hugo_version // ""' hugoblox.yaml)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Missing or invalid Hugo version in hugoblox.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo version used by deployment
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Install updated dependencies
        run: pnpm install --no-frozen-lockfile

      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows by themselves.
      # Validate the updated tree here before publishing a proposal.
      - name: Validate updated website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BLOX_LICENSE: ${{ secrets.HUGO_BLOX_LICENSE }}
        run: |
          pnpm run build
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html = fs.readFileSync('public/index.html', 'utf8');
          const missing = fs.readFileSync('public/404.html', 'utf8');
          assert(!/data-search-toggle|searchModal\(|SearchAction|hb-search/.test(html + missing), 'Search must remain disabled');
          for (const section of ['section-resume-biography', 'working-papers', 'publications', 'vita', 'contact']) {
            assert(new RegExp(`\\bid=["']?${section}(?:["'\\s>])`).test(html), `Missing homepage section: ${section}`);
          }
          assert(fs.readFileSync('public/uploads/resume.pdf').subarray(0, 5).equals(Buffer.from('%PDF-')), 'CV must remain available');
          for (const page of ['experience', 'publication_types', 'tags', 'authors', 'pagefind']) {
            assert(!fs.existsSync(`public/${page}`), `Unwanted generated output: ${page}`);
          }
          const sitemap = fs.readFileSync('public/sitemap.xml', 'utf8');
          assert.deepEqual([...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map(match => match[1]), ['https://philippschuster.org/']);
          console.log('PASS: homepage sections, CV, disabled search, removed archives, and sitemap');
          NODE

      - name: Create or update draft pull request
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): upgrade HugoBlox modules'
          title: 'Upgrade HugoBlox modules (${{ env.VERSION_TYPE }})'
          body: |
            Updates HugoBlox modules and applies any required configuration migrations.

            The updated site passed a production build with its configured Hugo version,
            plus checks for the homepage sections, CV, disabled search, removed archives,
            and homepage-only sitemap.

            [Automated validation run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Before merging:
            - Review the changed files and HugoBlox release notes.
            - Preview the site and check its appearance.
            - Mark this draft ready for review to run the normal Build checks.
            - Merge only after review and successful checks; merging publishes the update.
          # Reuse one proposal per channel instead of opening a new PR every week.
          branch: chore/upgrade-hugoblox${{ inputs.version_type == 'Beta (Preview)' && '-beta' || '' }}
          delete-branch: true
          base: main
          draft: always-true
          labels: |
            dependencies
            automated-pr

      - name: Record update proposal
        env:
          PROPOSAL_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          if [ -n "$PROPOSAL_URL" ]; then
            echo "Update proposal: $PROPOSAL_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Review the draft and mark it ready for review to run the normal build checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pending HugoBlox updates; the website checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi
